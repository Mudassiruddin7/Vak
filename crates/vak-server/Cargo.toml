[package]
name = "vak-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-gzip", "set-header", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vak-adapters = { version = "0.2.0", path = "../vak-adapters" }
vak-app = { version = "0.2.0", path = "../vak-app" }
vak-core = { version = "0.2.0", path = "../vak-core" }
