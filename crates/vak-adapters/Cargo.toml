[package]
name = "vak-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "multipart", "gzip", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
vak-app = { version = "0.2.0", path = "../vak-app" }
vak-core = { version = "0.2.0", path = "../vak-core" }
